[www]
listen = 127.0.0.1:9000
user = nobody
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no
catch_workers_output = yes

; PHP-FPM workers do not reliably inherit Docker/compose env.
; Pin Laravel runtime keys from the master process (set at container start).
env[APP_KEY] = $APP_KEY
env[APP_URL] = $APP_URL
env[APP_ENV] = $APP_ENV
env[APP_DEBUG] = $APP_DEBUG
env[APP_NAME] = $APP_NAME
env[DB_CONNECTION] = $DB_CONNECTION
env[DB_URL] = $DB_URL
env[CACHE_STORE] = $CACHE_STORE
env[SESSION_DRIVER] = $SESSION_DRIVER
env[QUEUE_CONNECTION] = $QUEUE_CONNECTION
env[LOG_CHANNEL] = $LOG_CHANNEL
env[LOG_LEVEL] = $LOG_LEVEL
env[LOG_STACK] = $LOG_STACK
